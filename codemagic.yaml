workflows:
  ios-release:
    name: ReelCraft AI iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Fetch Apple signing files (optional)
        script: |
          app-store-connect fetch-signing-files "com.necoai.reelcraft" --type IOS_APP_STORE --create || true
          xcode-project use-profiles || true
      - name: Build iOS Xcode App
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release archive -archivePath $HOME/build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
    artifacts:
      - $HOME/build/*.xcarchive
      - $HOME/build/**/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
