workflows:
  ios-release:
    name: ReelCraft AI iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.necoai.reelcraft" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS Xcode App & Export IPA
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -archivePath $HOME/build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath $HOME/build/App.xcarchive -exportOptionsPlist /Users/builder/export_options.plist -exportPath $HOME/build
    artifacts:
      - $HOME/build/*.ipa
      - $HOME/build/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
