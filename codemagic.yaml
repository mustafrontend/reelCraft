workflows:
  ios-release:
    name: ReelCraft AI iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS Xcode App
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -archivePath $HOME/build/App.xcarchive archive
    artifacts:
      - $HOME/build/*.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: ReelCraft AI Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      java: 17
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
      - name: Build Web Assets & Sync Android
        script: |
          npm run build
          npx cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
