workflows:
  ios-release:
    name: ReelCraft AI iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Build iOS Xcode App
        script: |
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release archive -archivePath $HOME/build/App.xcarchive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/build/*.xcarchive
      - $HOME/build/**/*.ipa
