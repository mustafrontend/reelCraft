workflows:
  ios-release:
    name: ReelCraft AI iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      node: latest
      xcode: latest
      vars:
        BUNDLE_ID: "com.necoai.reelcraft"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          # Private key'i build icinde uret (elle env variable gerekmez)
          openssl genrsa -out /tmp/cert_key.pem 2048
          # Bu key ile YENI iOS Distribution sertifikasi + App Store profili olustur
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set unique build number
        script: |
          cd ios/App
          agvtool new-version -all $(date +%s)
      - name: Build & export signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
